workflows:
  android-release:
    name: Android Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - android_signing # Keystore, password, etc.
        - firebase_config # FIREBASE_PROJECT_ID, API_KEYS, etc.
      flutter: stable
      java: 17
    scripts:
      - name: Create .env from secrets
        script: |
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" > .env
          echo "FIREBASE_ANDROID_API_KEY=$FIREBASE_ANDROID_API_KEY" >> .env
          echo "FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID" >> .env
          echo "FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY" >> .env
          echo "FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID" >> .env
          echo "FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET" >> .env
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          echo "storeFile=/tmp/keystore.jks" >> android/key.properties
          echo "storePassword=$CM_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter build native splash
        script: flutter pub run flutter_native_splash:create
      - name: Build Android APK
        script: flutter build apk --release --build-name=1.0.${BUILD_NUMBER} --build-number=${BUILD_NUMBER}
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - user@example.com # Replace with your email
